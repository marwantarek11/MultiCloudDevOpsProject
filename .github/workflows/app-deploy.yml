name: App Deploy

on:
  push:
    branches: [main]
    paths: ["Application/**", "k8s/**", ".github/workflows/**"]
  pull_request:
    paths: ["Application/**", "k8s/**", ".github/workflows/**"]

env:
  # The runner pod has a socat sidecar forwarding localhost:5000 to the in-cluster registry
  # (dockerd trusts localhost registries without TLS). kubelet pulls the same registry through
  # its NodePort, which containerd on the node is configured to trust.
  PUSH_IMAGE: localhost:5000/multicloud-app
  PULL_IMAGE: localhost:30500/multicloud-app
  NAMESPACE: multicloud-devops
  DEPLOYMENT: multicloud-app

jobs:
  build-test-deploy:
    runs-on: arc-runner-set
    defaults:
      run:
        working-directory: Application
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        if: github.event_name == 'push'
        working-directory: /tmp
        run: |
          mkdir -p "$HOME/bin"
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -m 0755 kubectl "$HOME/bin/kubectl"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 11 matches build.gradle's sourceCompatibility; the Gradle 7.3.3 wrapper's
          # Checkstyle task crashes under JDK 17+ due to a module-system incompatibility.
          java-version: "11"

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Static analysis (Checkstyle)
        run: ./gradlew checkstyleMain --no-daemon

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Build Docker image
        run: docker build -t ${{ env.PUSH_IMAGE }}:${{ github.sha }} -t ${{ env.PUSH_IMAGE }}:latest .

      - name: Scan image (Trivy, report only)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        # Report-only: a scanner or vulnerability-DB download problem must not block the deploy.
        continue-on-error: true
        with:
          image-ref: ${{ env.PUSH_IMAGE }}:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          scanners: vuln
          timeout: 20m

      - name: Publish Trivy report
        if: always()
        run: |
          REPORT="$GITHUB_WORKSPACE/trivy-report.txt"
          OUTCOME="${{ steps.trivy.outcome }}"
          {
            echo "## Trivy image scan"
            echo "Image: \`${{ env.PUSH_IMAGE }}:${{ github.sha }}\` - CRITICAL/HIGH findings that have a fix available"
            echo "Scan step outcome: \`$OUTCOME\`"
            echo
            if [ -s "$REPORT" ]; then
              echo '```'
              cat "$REPORT"
              echo '```'
            else
              echo "> No report was produced, the scan did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "::warning::Trivy produced no report (step outcome: $OUTCOME)"
          fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.PUSH_IMAGE }}:${{ github.sha }}
          docker push ${{ env.PUSH_IMAGE }}:latest

      - name: Deploy
        id: deploy
        if: github.event_name == 'push'
        run: |
          kubectl -n ${{ env.NAMESPACE }} set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.DEPLOYMENT }}=${{ env.PULL_IMAGE }}:${{ github.sha }}
          kubectl -n ${{ env.NAMESPACE }} rollout status deployment/${{ env.DEPLOYMENT }} --timeout=180s

      - name: Smoke test
        id: smoke
        if: github.event_name == 'push'
        run: |
          curl -sf --retry 5 --retry-delay 3 --retry-connrefused --max-time 10 \
            http://multicloud-app-service.${{ env.NAMESPACE }}.svc:8080/

      - name: Roll back on failure
        if: failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: kubectl -n ${{ env.NAMESPACE }} rollout undo deployment/${{ env.DEPLOYMENT }}
