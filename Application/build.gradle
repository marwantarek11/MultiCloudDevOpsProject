plugins {
    id 'org.springframework.boot' version '2.6.3'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id "org.sonarqube" version "6.3.1.5724"
}

checkstyle {
    toolVersion = '10.12.4'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    // Report only for now, matching the "scan but don't block" approach used for the
    // Trivy image scan stage - flip to false once the codebase is warning-clean.
    ignoreFailures = true
}
sonar {
  properties {
    property "sonar.projectKey", "my-sonarqube-demo"
    property "sonar.projectName", "my-sonarqube-demo"
  }
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' // Add this if using Thymeleaf
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport   // coverage report after every test run
}

// XML is picked up by the sonar task (coverage in SonarQube), HTML is published on the Jenkins build
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
