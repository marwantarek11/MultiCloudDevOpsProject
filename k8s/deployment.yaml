apiVersion: apps/v1
kind: Deployment
metadata:
  name: multicloud-app
  namespace: multicloud-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multicloud-app
  template:
    metadata:
      labels:
        app: multicloud-app
    spec:
      containers:
        - name: multicloud-app
          # kubelet pulls through the registry's NodePort; the CI runner pushes to the same
          # registry via the in-cluster service name (node DNS can't resolve *.svc names).
          image: localhost:30500/multicloud-app:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: multicloud-app-service
  namespace: multicloud-devops
spec:
  selector:
    app: multicloud-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
